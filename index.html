                      String(now.getMinutes()).padStart(2, '0');

      document.getElementById('receiptDate').innerText = `DATE: ${dateStr}`;
      document.getElementById('receiptCode').innerText = Math.floor(1000 + Math.random() * 9000);

      document.getElementById('totalHoursVal').innerText = totalCalculatedHours.toFixed(1).replace(/\.0$/, '');
      document.getElementById('totalDaysVal').innerText = totalEquivalentDays.replace(/\.00$/, '');

      document.getElementById('resFullDay').innerText = fullDays;
      document.getElementById('resFullDayH').innerText = fullDays * workHoursPerDay;

      document.getElementById('resHalfDay').innerText = halfDays;
      document.getElementById('resHalfDayH').innerText = halfDays * halfUnit;

      document.getElementById('resQuarterDay').innerText = quarterDays;
      document.getElementById('resQuarterDayH').innerText = quarterDays * quarterUnit;
      document.getElementById('quarterText').innerText = `${quarterUnit}h`;

      document.getElementById('resRemain').innerText = leftoverHours;

      document.getElementById('maxQuarterTimes').innerText = maxQuarterOnly;
      document.getElementById('maxHalfTimes').innerText = maxHalfOnly;

      // ?곸닔利??쒖떆 ?좊땲硫붿씠??
      receipt.classList.remove('hidden');
      receipt.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    calcBtn.addEventListener('click', calculate);

    // Enter ?ㅻ줈??利됱떆 怨꾩궛 媛?ν븯?꾨줉 泥섎━
    document.getElementById('remainDays').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') calculate();
    });
    document.getElementById('remainHours').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') calculate();
    });
  });
</script>
