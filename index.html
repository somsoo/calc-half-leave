<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반반차 휴가 영끌 계산기</title>
    <meta name="description" content="남은 연차와 반차, 반반차를 직관적으로 계산해주는 도구입니다.">
    <style>
        body { font-family: 'Pretendard', sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f9fafb; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; margin-top: 50px; }
        h1 { color: #111827; font-size: 24px; }
        p { color: #4b5563; line-height: 1.6; }
        .ad-slot { width: 100%; height: 100px; background: #e5e7eb; display: flex; align-items: center; justify-content: center; color: #9ca3af; margin: 20px 0; border-radius: 10px; border: 1px dashed #9ca3af; }
        .btn-share { background: #fee500; color: #000; padding: 15px 20px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .coupang-banner { width: 100%; height: 80px; background: #ff3131; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-top: 20px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2228289204702106" crossorigin="anonymous"></script>
    
    <div class="card">
        <h1>반반차 휴가 영끌 계산기</h1>
        <p>남은 연차와 반차, 반반차를 직관적으로 계산해주는 도구입니다.</p>
        
        <div id="leaveCalculatorApp" style="font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; max-width: 400px; margin: 20px auto; padding: 15px; background-color: #f8f8fa; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #e5e5e5; box-sizing: border-box;">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="font-size: 1.8em; color: #4CAF50; margin: 0; padding: 10px; background: linear-gradient(45deg, #e0ffe0, #c0ffc0); border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; white-space: nowrap;">반반차 휴가 영끌 계산기</h2>
        <p style="color: #666; font-size: 0.9em; margin-top: 5px; line-height: 1.4;">남은 연차, 반차, 반반차를 회사 정책에 맞게<br/>직관적으로 계산해 보세요!</p>
    </div>

    <div style="background-color: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); margin-bottom: 25px; border: 1px solid #eee; box-sizing: border-box;">
        <h3 style="color: #333; margin-top: 0; margin-bottom: 20px; font-size: 1.4em;">휴가 정보 입력</h3>

        <div style="margin-bottom: 15px;">
            <label for="totalAnnual" style="display: block; font-weight: bold; margin-bottom: 8px; color: #555;">총 연차 (일)</label>
            <input type="number" id="totalAnnual" value="15" min="0" step="0.5" style="width: calc(100% - 24px); padding: 12px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1em; appearance: textfield; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="usedAnnual" style="display: block; font-weight: bold; margin-bottom: 8px; color: #555;">사용 연차 (일)</label>
            <input type="number" id="usedAnnual" value="0" min="0" step="0.5" style="width: calc(100% - 24px); padding: 12px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1em; appearance: textfield; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="usedHalf" style="display: block; font-weight: bold; margin-bottom: 8px; color: #555;">사용 반차 (개)</label>
            <input type="number" id="usedHalf" value="0" min="0" style="width: calc(100% - 24px); padding: 12px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1em; appearance: textfield; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 20px;">
            <label for="usedQuarter" style="display: block; font-weight: bold; margin-bottom: 8px; color: #555;">사용 반반차 (개)</label>
            <input type="number" id="usedQuarter" value="0" min="0" style="width: calc(100% - 24px); padding: 12px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1em; appearance: textfield; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 25px; background-color: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px dashed #e0e0e0; box-sizing: border-box;">
            <label for="quarterPerHalf" style="display: block; font-weight: bold; margin-bottom: 8px; color: #555;">
                반차 1개당 반반차 개수
                <span style="font-size: 0.8em; color: #888; display: block; margin-top: 5px;">(예: 반차 1개 = 반반차 2개)</span>
            </label>
            <input type="number" id="quarterPerHalf" value="2" min="1" style="width: calc(100% - 24px); padding: 12px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1em; appearance: textfield; box-sizing: border-box;">
        </div>

        <div style="display: flex; gap: 10px;">
            <button id="calculateBtn" style="flex: 1; padding: 15px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 10px; font-size: 1.2em; font-weight: bold; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">계산하기</button>
            <button id="resetBtn" style="flex: 1; padding: 15px 20px; background-color: #f44336; color: white; border: none; border-radius: 10px; font-size: 1.2em; font-weight: bold; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">초기화</button>
        </div>
    </div>

    <div id="resultArea" style="background-color: #f0f8ff; padding: 25px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); border: 1px dashed #a0d8f0; display: none; box-sizing: border-box;">
        <h3 style="color: #007bff; margin-top: 0; margin-bottom: 20px; font-size: 1.4em; text-align: center;">💰 영끌 휴가 계산 결과 💰</h3>
        
        <div style="border-top: 2px dashed #a0d8f0; padding-top: 15px; margin-top: 15px;">
            <p style="font-size: 1.1em; color: #333; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-weight: bold; color: #007bff;">남은 연차</span> <span id="remainingAnnual" style="font-size: 1.3em; font-weight: bold; color: #007bff;">0일</span>
            </p>
            <p style="font-size: 1.1em; color: #333; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-weight: bold; color: #007bff;">남은 반차</span> <span id="remainingHalf" style="font-size: 1.3em; font-weight: bold; color: #007bff;">0개</span>
            </p>
            <p style="font-size: 1.1em; color: #333; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-weight: bold; color: #007bff;">남은 반반차</span> <span id="remainingQuarter" style="font-size: 1.3em; font-weight: bold; color: #007bff;">0개</span>
            </p>
        </div>

        <div style="border-top: 1px solid #e0e0e0; padding-top: 15px; margin-top: 20px; text-align: center;">
            <p style="font-size: 1.2em; color: #4CAF50; margin-bottom: 10px; font-weight: bold;">모든 휴가를 반반차로 바꾼다면:</p>
            <p style="font-size: 1.8em; font-weight: bold; color: #E91E63; display: flex; justify-content: center; align-items: baseline;">
                총 <span id="totalQuarterUnits" style="font-size: 1.5em; margin: 0 8px; color: #E91E63;">0</span> 반반차! 🎉
            </p>
        </div>
    </div>
</div>

<script>
    const calculateBtn = document.getElementById('calculateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultArea = document.getElementById('resultArea');

    const totalAnnualInput = document.getElementById('totalAnnual');
    const usedAnnualInput = document.getElementById('usedAnnual');
    const usedHalfInput = document.getElementById('usedHalf');
    const usedQuarterInput = document.getElementById('usedQuarter');
    const quarterPerHalfInput = document.getElementById('quarterPerHalf');

    const remainingAnnualSpan = document.getElementById('remainingAnnual');
    const remainingHalfSpan = document.getElementById('remainingHalf');
    const remainingQuarterSpan = document.getElementById('remainingQuarter');
    const totalQuarterUnitsSpan = document.getElementById('totalQuarterUnits');

    function calculateLeave() {
        // 1. Get input values and parse as numbers
        const totalAnnual = parseFloat(totalAnnualInput.value) || 0;
        const usedAnnual = parseFloat(usedAnnualInput.value) || 0;
        const usedHalf = parseInt(usedHalfInput.value) || 0;
        const usedQuarter = parseInt(usedQuarterInput.value) || 0;
        let quarterPerHalf = parseInt(quarterPerHalfInput.value) || 2; // Default to 2 if not provided or invalid

        // Input validation and sanitization
        if (quarterPerHalf < 1) {
            alert("⚠️ 반차 1개당 반반차 개수는 최소 1개 이상이어야 합니다. 기본값인 2로 설정됩니다.");
            quarterPerHalf = 2;
            quarterPerHalfInput.value = 2;
        }
        if (totalAnnual < 0 || usedAnnual < 0 || usedHalf < 0 || usedQuarter < 0) {
            alert("⚠️ 휴가 값은 음수가 될 수 없습니다. 다시 확인해주세요.");
            return;
        }

        // Convert everything to the smallest unit (반반차) for consistent calculation
        // 1 연차 = 2 반차 = (2 * quarterPerHalf) 반반차
        const annualToQuarterFactor = 2 * quarterPerHalf; 

        // Calculate total available leave in terms of quarter-day units
        const totalPossibleQuarterUnits = totalAnnual * annualToQuarterFactor;
        
        // Calculate total used leave in terms of quarter-day units
        const totalUsedQuarterUnits = (usedAnnual * annualToQuarterFactor) + (usedHalf * quarterPerHalf) + usedQuarter;

        let remainingQuarterUnits = totalPossibleQuarterUnits - totalUsedQuarterUnits;

        // Ensure remaining units are not negative
        if (remainingQuarterUnits < 0) {
            alert("🚨 사용하신 휴가(연차, 반차, 반반차 합산)가 총 연차보다 많습니다. 값을 다시 확인해주세요.");
            remainingQuarterUnits = 0; // Prevent negative display
        }

        // Deconstruct remainingQuarterUnits back into 연차, 반차, 반반차 for intuitive display
        let finalRemainingAnnual = Math.floor(remainingQuarterUnits / annualToQuarterFactor);
        let remainder = remainingQuarterUnits % annualToQuarterFactor;

        let finalRemainingHalf = Math.floor(remainder / quarterPerHalf);
        let finalRemainingQuarter = remainder % quarterPerHalf;

        // Display results
        remainingAnnualSpan.textContent = `${finalRemainingAnnual}일`;
        remainingHalfSpan.textContent = `${finalRemainingHalf}개`;
        remainingQuarterSpan.textContent = `${finalRemainingQuarter}개`;
        totalQuarterUnitsSpan.textContent = remainingQuarterUnits;

        resultArea.style.display = 'block'; // Show result area
    }

    function resetForm() {
        totalAnnualInput.value = '15';
        usedAnnualInput.value = '0';
        usedHalfInput.value = '0';
        usedQuarterInput.value = '0';
        quarterPerHalfInput.value = '2';

        remainingAnnualSpan.textContent = '0일';
        remainingHalfSpan.textContent = '0개';
        remainingQuarterSpan.textContent = '0개';
        totalQuarterUnitsSpan.textContent = '0';

        resultArea.style.display = 'none'; // Hide result area
    }

    // Event Listeners
    calculateBtn.addEventListener('click', calculateLeave);
    resetBtn.addEventListener('click', resetForm);

    // Initial state: hide result area on load
    document.addEventListener('DOMContentLoaded', () => {
        resultArea.style.display = 'none';
    });

    // Add simple hover/active effects for buttons (since inline style doesn't support :hover)
    calculateBtn.addEventListener('mouseover', function() { this.style.backgroundColor = '#43A047'; });
    calculateBtn.addEventListener('mouseout', function() { this.style.backgroundColor = '#4CAF50'; });
    calculateBtn.addEventListener('mousedown', function() { this.style.transform = 'scale(0.98)'; });
    calculateBtn.addEventListener('mouseup', function() { this.style.transform = 'scale(1)'; });

    resetBtn.addEventListener('mouseover', function() { this.style.backgroundColor = '#e53935'; });
    resetBtn.addEventListener('mouseout', function() { this.style.backgroundColor = '#f44336'; });
    resetBtn.addEventListener('mousedown', function() { this.style.transform = 'scale(0.98)'; });
    resetBtn.addEventListener('mouseup', function() { this.style.transform = 'scale(1)'; });
</script>
